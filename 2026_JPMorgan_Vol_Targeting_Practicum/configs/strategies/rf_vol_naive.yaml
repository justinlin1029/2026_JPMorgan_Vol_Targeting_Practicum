name: rf_vol_naive
description: Random Forest vol estimator with naive scaling

data:
  symbol: SPY
  source: databento
  price_col: close

estimator:
  class: src.estimators.rf_vol.RandomForestVolEstimator
  params:
    n_estimators: 100
    max_depth: 5
    lags: [1, 5, 22]
    train_window: 252

controller:
  class: src.controllers.naive_scaling.NaiveScaling
  params: {}

target_vol: 0.10
rebalance_freq: daily
weight_min: 0.0
weight_max: 1.5
cost_bps: 5.0
vol_ann: 252